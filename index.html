<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Snake Game - Welcome</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Educational Snake Game</h1>
            <p class="subtitle">Learn by Playing!</p>
        </header>

        <div class="welcome-screen">
            <div class="welcome-content">
                <h2>Welcome!</h2>
                <p>Choose your role to get started:</p>
                
                <div class="role-cards">
                    <div class="role-card teacher-card">
                        <div class="card-icon">👨‍🏫</div>
                        <h3>I'm a Teacher</h3>
                        <p>Create lessons and upload PDF content</p>
                        <a href="teacher.html" class="btn btn-large">Teacher Dashboard</a>
                    </div>
                    
                    <div class="role-card student-card">
                        <div class="card-icon">👨‍🎓</div>
                        <h3>I'm a Student</h3>
                        <p>Play and learn with your teacher's lesson</p>
                        <div id="studentModeSection">
                            <input type="text" id="lessonCodeInput" placeholder="Enter lesson code..." class="input-field">
                            <button id="playBtn" class="btn btn-large" disabled>Play Game</button>
                            <p id="codeError" class="error-text"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script>
        // Student mode - check for lesson code
        const lessonCodeInput = document.getElementById('lessonCodeInput');
        const playBtn = document.getElementById('playBtn');
        const codeError = document.getElementById('codeError');

        // Check if there's a lesson code in URL
        const urlParams = new URLSearchParams(window.location.search);
        const lessonCode = urlParams.get('lesson');
        
        if (lessonCode) {
            lessonCodeInput.value = lessonCode;
            validateAndPlay();
        }

        lessonCodeInput.addEventListener('input', () => {
            codeError.textContent = '';
            playBtn.disabled = !lessonCodeInput.value.trim();
        });

        playBtn.addEventListener('click', validateAndPlay);

        function validateAndPlay() {
            const code = lessonCodeInput.value.trim();
            if (!code) return;

            const lessons = LessonStorage.getAllLessons();
            const lesson = lessons.find(l => l.code === code);

            if (!lesson) {
                codeError.textContent = '❌ Lesson code not found. Please check and try again.';
                playBtn.disabled = true;
                return;
            }

            // Store current lesson and redirect to game
            LessonStorage.setCurrentLesson(code);
            window.location.href = 'game.html';
        }
    </script>
</body>
</html>
